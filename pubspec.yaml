name: account_manager
description: "A Flutter plugin for cross-platform account management, authentication, and background sync using native platform APIs."
version: 1.0.0
homepage: https://github.com/lkrjangid1/account_manager
repository: https://github.com/lkrjangid1/account_manager
issue_tracker: https://github.com/lkrjangid1/account_manager/issues
topics:
  - account
  - authentication
  - sync
  - keychain
  - android
  - ios

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  plugin:
    platforms:
      android:
        package: com.lkrjangid.account_manager
        pluginClass: AccountManagerPlugin
      ios:
        pluginClass: AccountManagerPlugin
